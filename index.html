  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand home-link" href="#/home" title="Back to all BagelTools apps">
        <img class="logo-dark" src="assets/logo-dark.png" alt="FRC Team 702 Bagel Bytes logo" />
        <img class="logo-light" src="assets/logo.png" alt="FRC Team 702 Bagel Bytes logo" />
        <div class="brand-text">
          <span class="team">Bagel<span class="team-accent">Tools</span></span>
          <span class="sub"><svg class="ico"><use href="#ic-chevron-left"/></svg> All apps</span>
        </div>
      </a>

      <div class="app-head" id="appHead"></div>

      <div class="event-chip" id="eventChip">No event selected</div>

      <nav class="nav" id="nav" aria-label="App pages"></nav>

      <div class="sidebar-foot">
        <div class="user-chip" id="userChip" hidden>
          <svg class="ico"><use href="#ic-user"/></svg>
          <span id="userChipName"></span>
          <button class="icon-btn sm" id="logoutBtn" aria-label="Log out" title="Log out"><svg class="ico"><use href="#ic-logout"/></svg></button>
        </div>
        <button class="btn ghost sm" id="themeToggle" aria-label="Toggle light/dark theme">
          <svg class="ico"><use href="#ic-moon"/></svg> <span>Theme</span>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg class="ico"><use href="#ic-menu"/></svg>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="spacer"></div>
        <div class="gsearch" id="gSearch">
          <button class="icon-btn gs-open" id="gsOpen" type="button" aria-label="Search teams and events"><svg class="ico"><use href="#ic-search"/></svg></button>
          <div class="gs-box">
            <svg class="ico"><use href="#ic-search"/></svg>
            <input id="gsInput" type="search" placeholder="Search teams &amp; events…" autocomplete="off" spellcheck="false"
              role="combobox" aria-expanded="false" aria-controls="gsList" aria-autocomplete="list" aria-label="Search teams and events" />
            <kbd class="gs-kbd">/</kbd>
          </div>
          <div class="gs-panel" id="gsList" role="listbox" hidden></div>
        </div>
        <div class="scout-tag" id="scoutTag"></div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <!-- Firebase (optional cloud sync). Harmless if firebaseConfig is empty — the
       app just runs local-only. compat build = no bundler needed. -->
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/store.js?v=100"></script>

  <script src="js/auth.js?v=100"></script>
  <script src="js/cloud.js?v=100"></script>
  <script src="js/bets.js?v=100"></script>
